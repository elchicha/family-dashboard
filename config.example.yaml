# Family Dashboard Configuration Template
# ========================================
# PRIVACY: Copy this to config.yaml and fill in your details
# config.yaml is .gitignored and will never be committed

display:
  width: 800
  height: 480
  type: "png"  # "png" for testing, "eink" for production

calendars:
  # List your calendar sources here
  # Each calendar will be merged into the main view
  sources:
    - name: "School Calendar 1"
      short_name: "SCH1"  # Short tag displayed on dashboard
      url: "https://calendar.google.com/calendar/ical/CALENDAR_ID_HERE/public/basic.ics"
      enabled: true

    - name: "School Calendar 2"
      short_name: "SCH2"  # Short tag displayed on dashboard
      url: "https://calendar.google.com/calendar/ical/CALENDAR_ID_HERE/public/basic.ics"
      enabled: true

    - name: "School Calendar 3"
      short_name: "SCH3"  # Short tag displayed on dashboard
      url: "https://calendar.google.com/calendar/ical/CALENDAR_ID_HERE/public/basic.ics"
      enabled: true

  cache_duration_minutes: 5
  view_mode: "three_day"  # "single_day" or "three_day"

weather:
  enabled: true
  city: "Your City"
  units: "celsius"  # "celsius" or "fahrenheit"
  api_key: "YOUR_OPENWEATHER_API_KEY"
  # Get free API key: https://openweathermap.org/api

shopping_list:
  enabled: false
  file: "./data/shopping_list.json"

tasks:
  enabled: false
  file: "./data/tasks.json"

family:
  members:
    - name: "Member1"
    - name: "Member2"